<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="60%" stop-color="#07080a" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>
    <linearGradient id="acc1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7FF64" />
      <stop offset="100%" stop-color="#80A814" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="720" height="1280" fill="url(#bg1)" />
  
  <!-- Subtle editorial grid lines -->
  <line x1="60" y1="0" x2="60" y2="1280" stroke="#1f242d" stroke-width="1" stroke-dasharray="4 6" />
  <line x1="660" y1="0" x2="660" y2="1280" stroke="#1f242d" stroke-width="1" stroke-dasharray="4 6" />
  
  <!-- Top Editor Status Bar -->
  <rect x="60" y="80" width="10" height="10" rx="5" fill="#FF3B30" />
  <text x="80" y="90" fill="#FF3B30" font-family="monospace" font-size="16" letter-spacing="3" font-weight="700">REC 4K60</text>
  <text x="500" y="90" fill="#D7FF64" font-family="monospace" font-size="16" letter-spacing="2">00:00:46:12</text>
  
  <!-- Center Visual Graphic: Framework Chart & Dynamic UI -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="600" height="520" rx="16" fill="#12161f" stroke="#222b3a" stroke-width="2" />
    <!-- Window bar -->
    <rect x="0" y="0" width="600" height="48" rx="16" fill="#181f2c" />
    <circle cx="32" cy="24" r="6" fill="#FF5F56" />
    <circle cx="52" cy="24" r="6" fill="#FFBD2E" />
    <circle cx="72" cy="24" r="6" fill="#27C93F" />
    <text x="100" y="30" fill="#8892b0" font-family="monospace" font-size="14">SEQ_01_ZERO_TO_ONE.PRPROJ</text>
    
    <!-- Retention Framework Flowchart -->
    <path d="M60 380 L 220 280 L 380 320 L 520 160" fill="none" stroke="url(#acc1)" stroke-width="5" stroke-linecap="round" />
    <circle cx="60" cy="380" r="8" fill="#D7FF64" />
    <circle cx="220" cy="280" r="8" fill="#D7FF64" />
    <circle cx="380" cy="320" r="8" fill="#D7FF64" />
    <circle cx="520" cy="160" r="10" fill="#FFFFFF" stroke="#D7FF64" stroke-width="4" />

    <!-- Metric Callout -->
    <rect x="360" y="80" width="200" height="60" rx="8" fill="#0b0e14" stroke="#D7FF64" stroke-width="1.5" />
    <text x="380" y="105" fill="#D7FF64" font-family="monospace" font-size="13" font-weight="700">+184% RETENTION</text>
    <text x="380" y="125" fill="#8E8E93" font-family="sans-serif" font-size="12">Pacing Optimized</text>
  </g>

  <!-- Title & Kinetic Captions Overlay -->
  <text x="60" y="860" fill="#D7FF64" font-family="monospace" font-size="18" letter-spacing="3" font-weight="700">BUSINESS &amp; EDUCATION</text>
  <text x="60" y="930" fill="#F5F5F2" font-family="sans-serif" font-size="44" font-weight="900" letter-spacing="-1">THE ZERO-TO-ONE</text>
  <text x="60" y="985" fill="#F5F5F2" font-family="sans-serif" font-size="44" font-weight="900" letter-spacing="-1">FRAMEWORK</text>
  <text x="60" y="1040" fill="#8E8E93" font-family="sans-serif" font-size="20">Tech Founder / Venture Strategy</text>

  <!-- Audio Waveform Decorator -->
  <g transform="translate(60, 1140)">
    <rect x="0" y="0" width="600" height="3" fill="#1f242d" />
    <rect x="0" y="0" width="260" height="3" fill="#D7FF64" />
    <circle cx="260" cy="1.5" r="5" fill="#D7FF64" />
    <text x="0" y="32" fill="#666" font-family="monospace" font-size="14">V1: CUTS &amp; ZOOM</text>
    <text x="460" y="32" fill="#D7FF64" font-family="monospace" font-size="14">A1: MASTERED</text>
  </g>
</svg>
